[package]
name = "akikazu-remote"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Akikazu Remote Phase 0: manual-signaling P2P connectivity test"
publish = false

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
webrtc = "0.21.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
